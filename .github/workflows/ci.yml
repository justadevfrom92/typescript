name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projects
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Projects/package-lock.json
      - run: npm ci
      - name: Type-check and compile every project
        run: npm run build
      - name: Run unit tests (node:test)
        run: node --test "*/dist/**/*.test.js"
      - name: Smoke-test the static server
        run: |
          PORT=4173 node serve.mjs &
          sleep 1
          for project in 06-PostsBrowser 07-WeatherDashboard 08-PokemonExplorer 09-CurrencyConverter 10-PhotoGallery 11-TaskBoard 12-ModularArchitecture; do
            curl -fsS "http://localhost:4173/$project/" > /dev/null
            curl -fsS "http://localhost:4173/$project/dist/main.js" > /dev/null
          done
          curl -fsS "http://localhost:4173/Shared/dist/jsx-runtime.js" > /dev/null
      - name: Collect the static site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: |
          mkdir _site
          tar -C Projects --exclude=node_modules --exclude='*.tsbuildinfo' -cf - . | tar -C _site -xf -
          touch _site/.nojekyll
      - name: Upload the site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    # Publishes the browser projects to GitHub Pages after build and tests pass on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
